<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order #<span th:text="${order.id}"></span> - ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background: #1a1a2e;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/products"><i class="fas fa-shopping-bag me-2"></i>ShopEasy</a>
        <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
                <a class="nav-link position-relative" th:href="@{/cart}">
                    <i class="fas fa-shopping-cart fa-lg"></i>
                    <span class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle"
                          th:text="${cartCount}" th:if="${cartCount > 0}"></span>
                </a>
            </li>
            <li class="nav-item"><a class="nav-link" th:href="@{/profile}"><i class="fas fa-user-circle fa-lg"></i></a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="container py-4">

    <a th:href="@{/profile}" class="text-decoration-none mb-3 d-inline-block">
        <i class="fas fa-arrow-left me-2"></i>Back to My Orders
    </a>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <span><i class="fas fa-receipt me-2"></i>Order #<span th:text="${order.id}"></span></span>
            <span th:class="${'badge ' + (order.status == 'PLACED' ? 'bg-warning text-dark' :
                                         order.status == 'DELIVERED' ? 'bg-success' :
                                         order.status == 'CANCELLED' ? 'bg-danger' : 'bg-info')}"
                  th:text="${order.status}"></span>
        </div>
        <div class="card-body">
            <div class="row mb-3">
                <div class="col-sm-6">
                    <strong>Order Date:</strong>
                    <p th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, hh:mm a')}"></p>
                </div>
                <div class="col-sm-6">
                    <strong>Payment Method:</strong>
                    <p th:text="${order.paymentMethod}"></p>
                </div>
                <div class="col-sm-12">
                    <strong>Shipping To:</strong>
                    <p th:text="${order.shippingAddress}"></p>
                </div>
            </div>

            <h6 class="fw-bold border-bottom pb-2">Items Ordered</h6>
            <div th:each="item : ${order.orderItems}" class="d-flex align-items-center justify-content-between py-2 border-bottom">
                <div class="d-flex align-items-center gap-3">
                    <img th:src="${item.product.imageUrl}" style="width:50px;height:50px;object-fit:cover;border-radius:8px;"
                         onerror="this.src='https://via.placeholder.com/50'">
                    <div>
                        <div class="fw-bold" th:text="${item.product.name}"></div>
                        <small class="text-muted">Qty: <span th:text="${item.quantity}"></span> × ₹<span th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')}"></span></small>
                    </div>
                </div>
                <span class="fw-bold text-primary"
                      th:text="'₹' + ${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')}"></span>
            </div>

            <div class="d-flex justify-content-between fw-bold fs-5 mt-3">
                <span>Total Paid:</span>
                <span class="text-success"
                      th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')}"></span>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
