<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Placed! - ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark sticky-top" style="background: #1a1a2e;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/products"><i class="fas fa-shopping-bag me-2"></i>ShopEasy</a>
        <a class="nav-link text-white" th:href="@{/cart}">
            <i class="fas fa-shopping-cart fa-lg"></i>
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <!-- SUCCESS ANIMATION -->
            <div class="text-center mb-4">
                <div class="success-circle mx-auto mb-3">
                    <i class="fas fa-check"></i>
                </div>
                <h2 class="fw-bold text-success">Order Placed Successfully!</h2>
                <p class="text-muted fs-5">Thank you for shopping with ShopEasy!</p>
            </div>

            <!-- ORDER DETAILS CARD -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-success text-white d-flex justify-content-between">
                    <span><i class="fas fa-receipt me-2"></i>Order Confirmation</span>
                    <span>Order #<span th:text="${order.id}"></span></span>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-sm-6">
                            <strong>Order Date:</strong>
                            <p th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, hh:mm a')}"></p>
                        </div>
                        <div class="col-sm-6">
                            <strong>Payment Method:</strong>
                            <p th:text="${order.paymentMethod}"></p>
                        </div>
                        <div class="col-sm-6">
                            <strong>Order Status:</strong>
                            <span class="badge bg-warning text-dark" th:text="${order.status}"></span>
                        </div>
                        <div class="col-sm-6">
                            <strong>Shipping To:</strong>
                            <p th:text="${order.shippingAddress}"></p>
                        </div>
                    </div>

                    <!-- ORDERED ITEMS -->
                    <h6 class="fw-bold border-bottom pb-2">Items Ordered</h6>
                    <div th:each="item : ${order.orderItems}" class="d-flex align-items-center justify-content-between py-2 border-bottom">
                        <div class="d-flex align-items-center gap-3">
                            <img th:src="${item.product.imageUrl}" style="width:50px;height:50px;object-fit:cover;border-radius:8px;"
                                 onerror="this.src='https://via.placeholder.com/50'">
                            <div>
                                <div class="fw-bold" th:text="${item.product.name}"></div>
                                <small class="text-muted">Qty: <span th:text="${item.quantity}"></span> × ₹<span th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')}"></span></small>
                            </div>
                        </div>
                        <span class="fw-bold text-primary"
                              th:text="'₹' + ${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')}"></span>
                    </div>

                    <!-- TOTAL -->
                    <div class="d-flex justify-content-between fw-bold fs-5 mt-3">
                        <span>Total Paid:</span>
                        <span class="text-success"
                              th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')}"></span>
                    </div>
                </div>
            </div>

            <!-- ACTION BUTTONS -->
            <div class="d-flex gap-3 justify-content-center">
                <a th:href="@{/products}" class="btn btn-primary btn-lg">
                    <i class="fas fa-shopping-bag me-2"></i>Continue Shopping
                </a>
                <a th:href="@{/profile}" class="btn btn-outline-primary btn-lg">
                    <i class="fas fa-box me-2"></i>View My Orders
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
