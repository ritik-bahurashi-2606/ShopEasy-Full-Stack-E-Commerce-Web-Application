<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name} + ' - ShopEasy'">Product - ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background: #1a1a2e;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/products">
            <i class="fas fa-shopping-bag me-2"></i>ShopEasy
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link position-relative" th:href="@{/cart}">
                        <i class="fas fa-shopping-cart fa-lg"></i>
                        <span class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle"
                              th:text="${cartCount}" th:if="${cartCount != null and cartCount > 0}"></span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/profile}"><i class="fas fa-user-circle fa-lg"></i></a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/logout}">Logout</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-warning btn-sm" th:href="@{/login}">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">

    <!-- BREADCRUMB -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/products}">Products</a></li>
            <li class="breadcrumb-item"><a th:href="@{/products(category=${product.category})}" th:text="${product.category}"></a></li>
            <li class="breadcrumb-item active" th:text="${product.name}"></li>
        </ol>
    </nav>

    <!-- FLASH MESSAGES -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row">
        <!-- PRODUCT IMAGE -->
        <div class="col-md-5">
            <div class="product-detail-img-wrap">
                <img th:src="${product.imageUrl}" class="img-fluid rounded shadow-sm" th:alt="${product.name}"
                     onerror="this.src='https://via.placeholder.com/500x400?text=Product+Image'">
            </div>
        </div>

        <!-- PRODUCT INFO -->
        <div class="col-md-7">
            <div class="ps-md-4">
                <span class="badge bg-primary mb-2" th:text="${product.category}"></span>
                <h2 class="fw-bold" th:text="${product.name}"></h2>
                <p class="text-muted mb-2">Brand: <strong th:text="${product.brand}"></strong></p>

                <!-- RATING -->
                <div class="d-flex align-items-center mb-3">
                    <div class="text-warning">
                        <i th:each="i : ${#numbers.sequence(1, 5)}"
                           th:class="${i <= product.rating} ? 'fas fa-star' : 'far fa-star'"></i>
                    </div>
                    <span class="ms-2 text-muted" th:text="${product.rating} + ' / 5.0'"></span>
                </div>

                <!-- PRICE -->
                <div class="product-price-large mb-3" th:text="'₹' + ${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')}"></div>

                <!-- STOCK -->
                <div class="mb-3">
                    <span th:if="${product.stock > 0}" class="badge bg-success">
                        <i class="fas fa-check me-1"></i> In Stock (<span th:text="${product.stock}"></span> available)
                    </span>
                    <span th:if="${product.stock == 0}" class="badge bg-danger">Out of Stock</span>
                </div>

                <!-- DESCRIPTION -->
                <div class="mb-4">
                    <h5>Product Description</h5>
                    <p class="text-muted" th:text="${product.description}"></p>
                </div>

                <!-- ADD TO CART FORM -->
                <div sec:authorize="isAuthenticated()">
                    <form th:action="@{/cart/add}" method="post" class="d-flex align-items-center gap-3">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <div class="d-flex align-items-center border rounded">
                            <button type="button" class="btn btn-sm px-3" onclick="decrementQty()">−</button>
                            <input type="number" name="quantity" id="qty" value="1" min="1"
                                   th:max="${product.stock}" class="form-control border-0 text-center" style="width: 60px;">
                            <button type="button" class="btn btn-sm px-3" onclick="incrementQty()">+</button>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg"
                                th:disabled="${product.stock == 0}">
                            <i class="fas fa-cart-plus me-2"></i> Add to Cart
                        </button>
                    </form>
                </div>

                <!-- LOGIN PROMPT -->
                <div sec:authorize="!isAuthenticated()" class="mt-3">
                    <a th:href="@{/login}" class="btn btn-primary btn-lg">
                        <i class="fas fa-sign-in-alt me-2"></i> Login to Add to Cart
                    </a>
                </div>

                <!-- PRODUCT FEATURES -->
                <div class="mt-4 p-3 bg-light rounded">
                    <div class="row text-center">
                        <div class="col-4">
                            <i class="fas fa-truck fa-2x text-primary mb-1"></i>
                            <p class="small mb-0 fw-bold">Free Delivery</p>
                            <p class="small text-muted">On orders above ₹500</p>
                        </div>
                        <div class="col-4">
                            <i class="fas fa-undo fa-2x text-primary mb-1"></i>
                            <p class="small mb-0 fw-bold">Easy Returns</p>
                            <p class="small text-muted">7-day return policy</p>
                        </div>
                        <div class="col-4">
                            <i class="fas fa-shield-alt fa-2x text-primary mb-1"></i>
                            <p class="small mb-0 fw-bold">Secure Payment</p>
                            <p class="small text-muted">100% secure checkout</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/products}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-2"></i> Back to Products
        </a>
    </div>
</div>

<footer class="footer mt-5">
    <div class="container text-center py-4">
        <p class="mb-0">&copy; 2024 ShopEasy. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function incrementQty() {
        let qty = document.getElementById('qty');
        let max = parseInt(qty.max) || 999;
        if (parseInt(qty.value) < max) qty.value = parseInt(qty.value) + 1;
    }
    function decrementQty() {
        let qty = document.getElementById('qty');
        if (parseInt(qty.value) > 1) qty.value = parseInt(qty.value) - 1;
    }
</script>
</body>
</html>
