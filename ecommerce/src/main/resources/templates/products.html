<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Products - ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background: #1a1a2e;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/products">
            <i class="fas fa-shopping-bag me-2"></i>ShopEasy
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <!-- Search Bar -->
            <form class="d-flex mx-auto" th:action="@{/products}" method="get" style="width: 40%;">
                <div class="input-group">
                    <input type="text" name="search" class="form-control" placeholder="Search products..."
                           th:value="${searchQuery}">
                    <button class="btn btn-warning" type="submit"><i class="fas fa-search"></i></button>
                </div>
            </form>

            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link position-relative" th:href="@{/cart}">
                        <i class="fas fa-shopping-cart fa-lg"></i>
                        <span class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle"
                              th:text="${cartCount}" th:if="${cartCount != null and cartCount > 0}"></span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/profile}"><i class="fas fa-user-circle fa-lg"></i></a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}"><i class="fas fa-sign-in-alt"></i> Login</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-warning btn-sm ms-2" th:href="@{/register}">Register</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- HERO BANNER -->
<div class="hero-banner">
    <div class="container text-center text-white py-5">
        <h1 class="fw-bold display-5">Discover Amazing Products</h1>
        <p class="lead">Quality products at unbeatable prices</p>
    </div>
</div>

<div class="container py-4">

    <!-- CATEGORY FILTERS -->
    <div class="category-tabs mb-4">
        <a th:href="@{/products}" class="btn btn-sm me-2 mb-2"
           th:classappend="${selectedCategory == null and searchQuery == null} ? 'btn-dark' : 'btn-outline-dark'">
            All
        </a>
        <a th:each="cat : ${categories}"
           th:href="@{/products(category=${cat})}"
           class="btn btn-sm me-2 mb-2"
           th:classappend="${selectedCategory == cat} ? 'btn-dark' : 'btn-outline-dark'"
           th:text="${cat}">
        </a>
    </div>

    <!-- SEARCH / FILTER INFO -->
    <div th:if="${searchQuery}" class="alert alert-info">
        Search results for: <strong th:text="${searchQuery}"></strong>
        <a th:href="@{/products}" class="ms-3 btn btn-sm btn-outline-secondary">Clear</a>
    </div>

    <!-- PRODUCTS GRID -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" th:if="${!products.isEmpty()}">
        <div class="col" th:each="product : ${products}">
            <div class="card product-card h-100">
                <div class="product-img-wrap">
                    <img th:src="${product.imageUrl}" class="card-img-top product-img" th:alt="${product.name}"
                         onerror="this.src='https://via.placeholder.com/300x200?text=Product'">
                    <div class="product-badge" th:text="${product.category}"></div>
                </div>
                <div class="card-body d-flex flex-column">
                    <p class="text-muted small mb-1" th:text="${product.brand}"></p>
                    <h6 class="card-title fw-bold" th:text="${product.name}"></h6>
                    <p class="card-text text-muted small flex-grow-1"
                       th:text="${#strings.abbreviate(product.description, 80)}"></p>

                    <div class="d-flex align-items-center mb-2">
                        <span class="text-warning small">
                            <i class="fas fa-star" th:each="i : ${#numbers.sequence(1, 5)}"
                               th:classappend="${i <= product.rating} ? 'fas fa-star' : 'far fa-star'"></i>
                        </span>
                        <small class="ms-1 text-muted" th:text="${product.rating}"></small>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-auto">
                        <span class="product-price" th:text="'₹' + ${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')}"></span>
                        <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-sm btn-primary">
                            View Details
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- NO PRODUCTS -->
    <div th:if="${products.isEmpty()}" class="text-center py-5">
        <i class="fas fa-search fa-3x text-muted mb-3"></i>
        <h4 class="text-muted">No products found</h4>
        <a th:href="@{/products}" class="btn btn-primary mt-3">Browse All Products</a>
    </div>
</div>

<!-- FOOTER -->
<footer class="footer mt-5">
    <div class="container text-center py-4">
        <p class="mb-0">&copy; 2024 ShopEasy. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
