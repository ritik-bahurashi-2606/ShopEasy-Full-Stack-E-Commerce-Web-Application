<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile - ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background: #1a1a2e;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/products"><i class="fas fa-shopping-bag me-2"></i>ShopEasy</a>
        <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
                <a class="nav-link position-relative" th:href="@{/cart}">
                    <i class="fas fa-shopping-cart fa-lg"></i>
                    <span class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle"
                          th:text="${cartCount}" th:if="${cartCount > 0}"></span>
                </a>
            </li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/profile}"><i class="fas fa-user-circle fa-lg"></i></a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="container py-4">

    <!-- FLASH MESSAGES -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
        <i class="fas fa-check-circle me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row">
        <!-- SIDEBAR -->
        <div class="col-md-3 mb-4">
            <div class="card shadow-sm text-center p-3">
                <div class="profile-avatar mx-auto mb-3">
                    <i class="fas fa-user fa-2x"></i>
                </div>
                <h5 class="fw-bold" th:text="${user.fullName}"></h5>
                <p class="text-muted small" th:text="${user.email}"></p>
                <hr>
                <ul class="list-unstyled text-start">
                    <li class="mb-2">
                        <a href="#profileSection" class="text-decoration-none text-dark">
                            <i class="fas fa-user me-2 text-primary"></i>My Profile
                        </a>
                    </li>
                    <li class="mb-2">
                        <a href="#ordersSection" class="text-decoration-none text-dark">
                            <i class="fas fa-box me-2 text-primary"></i>My Orders
                            <span class="badge bg-primary ms-1" th:text="${orders.size()}"></span>
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/logout}" class="text-decoration-none text-danger">
                            <i class="fas fa-sign-out-alt me-2"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="col-md-9">

            <!-- PROFILE SECTION -->
            <div class="card shadow-sm mb-4" id="profileSection">
                <div class="card-header d-flex justify-content-between align-items-center bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-user me-2"></i>Personal Information</h5>
                    <button class="btn btn-sm btn-light" onclick="toggleEdit()">
                        <i class="fas fa-edit me-1"></i>Edit
                    </button>
                </div>
                <div class="card-body">

                    <!-- VIEW MODE -->
                    <div id="viewMode">
                        <div class="row">
                            <div class="col-sm-6 mb-3">
                                <label class="text-muted small">First Name</label>
                                <p class="fw-bold" th:text="${user.firstName}">-</p>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="text-muted small">Last Name</label>
                                <p class="fw-bold" th:text="${user.lastName}">-</p>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="text-muted small">Email</label>
                                <p class="fw-bold" th:text="${user.email}">-</p>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="text-muted small">Phone</label>
                                <p class="fw-bold" th:text="${user.phone != null ? user.phone : 'Not provided'}">-</p>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="text-muted small">Address</label>
                                <p class="fw-bold" th:text="${user.address != null ? user.address : 'Not provided'}">-</p>
                            </div>
                            <div class="col-sm-2 mb-3">
                                <label class="text-muted small">City</label>
                                <p class="fw-bold" th:text="${user.city != null ? user.city : '-'}">-</p>
                            </div>
                            <div class="col-sm-2 mb-3">
                                <label class="text-muted small">State</label>
                                <p class="fw-bold" th:text="${user.state != null ? user.state : '-'}">-</p>
                            </div>
                            <div class="col-sm-2 mb-3">
                                <label class="text-muted small">PIN Code</label>
                                <p class="fw-bold" th:text="${user.pinCode != null ? user.pinCode : '-'}">-</p>
                            </div>
                        </div>
                    </div>

                    <!-- EDIT MODE -->
                    <div id="editMode" style="display:none;">
                        <form th:action="@{/profile/update}" method="post">
                            <div class="row">
                                <div class="col-sm-6 mb-3">
                                    <label class="form-label">First Name</label>
                                    <input type="text" name="firstName" class="form-control" th:value="${user.firstName}" required>
                                </div>
                                <div class="col-sm-6 mb-3">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" name="lastName" class="form-control" th:value="${user.lastName}" required>
                                </div>
                                <div class="col-sm-6 mb-3">
                                    <label class="form-label">Phone</label>
                                    <input type="text" name="phone" class="form-control" th:value="${user.phone}">
                                </div>
                                <div class="col-sm-6 mb-3">
                                    <label class="form-label">Address</label>
                                    <input type="text" name="address" class="form-control" th:value="${user.address}">
                                </div>
                                <div class="col-sm-4 mb-3">
                                    <label class="form-label">City</label>
                                    <input type="text" name="city" class="form-control" th:value="${user.city}">
                                </div>
                                <div class="col-sm-4 mb-3">
                                    <label class="form-label">State</label>
                                    <input type="text" name="state" class="form-control" th:value="${user.state}">
                                </div>
                                <div class="col-sm-4 mb-3">
                                    <label class="form-label">PIN Code</label>
                                    <input type="text" name="pinCode" class="form-control" th:value="${user.pinCode}">
                                </div>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-1"></i>Save Changes
                                </button>
                                <button type="button" class="btn btn-secondary" onclick="toggleEdit()">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- ORDERS SECTION -->
            <div class="card shadow-sm" id="ordersSection">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0"><i class="fas fa-box me-2"></i>Order History
                        <span class="badge bg-primary ms-2" th:text="${orders.size()} + ' orders'"></span>
                    </h5>
                </div>
                <div class="card-body p-0">

                    <!-- NO ORDERS -->
                    <div th:if="${orders.isEmpty()}" class="text-center py-5">
                        <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
                        <h5 class="text-muted">No orders yet</h5>
                        <a th:href="@{/products}" class="btn btn-primary mt-2">Start Shopping</a>
                    </div>

                    <!-- ORDERS LIST -->
                    <div th:each="order : ${orders}" class="order-card p-3 border-bottom">
                        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                            <div>
                                <span class="fw-bold">Order #<span th:text="${order.id}"></span></span>
                                <br>
                                <small class="text-muted"
                                       th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, hh:mm a')}"></small>
                            </div>
                            <div class="text-end">
                                <span th:class="${'badge ' + (order.status == 'PLACED' ? 'bg-warning text-dark' :
                                                             order.status == 'DELIVERED' ? 'bg-success' :
                                                             order.status == 'CANCELLED' ? 'bg-danger' : 'bg-info')}"
                                      th:text="${order.status}"></span>
                                <br>
                                <span class="fw-bold text-primary"
                                      th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')}"></span>
                            </div>
                        </div>

                        <!-- ORDER ITEMS PREVIEW -->
                        <div class="d-flex gap-2 mt-2 flex-wrap">
                            <div th:each="item : ${order.orderItems}" class="d-flex align-items-center bg-light rounded p-2">
                                <img th:src="${item.product.imageUrl}"
                                     style="width:35px;height:35px;object-fit:cover;border-radius:5px;"
                                     onerror="this.src='https://via.placeholder.com/35'">
                                <small class="ms-2" th:text="${item.product.name} + ' x' + ${item.quantity}"></small>
                            </div>
                        </div>

                        <div class="mt-2">
                            <small class="text-muted">
                                <i class="fas fa-map-marker-alt me-1"></i>
                                <span th:text="${order.shippingAddress}"></span>
                            </small>
                        </div>
                        <div class="mt-2">
                            <small class="text-muted">Payment: <span th:text="${order.paymentMethod}"></span></small>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<footer class="footer mt-5">
    <div class="container text-center py-4">
        <p class="mb-0">&copy; 2024 ShopEasy. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function toggleEdit() {
    let view = document.getElementById('viewMode');
    let edit = document.getElementById('editMode');
    view.style.display = view.style.display === 'none' ? 'block' : 'none';
    edit.style.display = edit.style.display === 'none' ? 'block' : 'none';
}
</script>
</body>
</html>
