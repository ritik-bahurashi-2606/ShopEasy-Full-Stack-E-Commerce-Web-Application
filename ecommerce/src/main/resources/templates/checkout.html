<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkout - ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark sticky-top" style="background: #1a1a2e;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/products"><i class="fas fa-shopping-bag me-2"></i>ShopEasy</a>
        <span class="text-white">Secure Checkout <i class="fas fa-lock ms-2"></i></span>
    </div>
</nav>

<div class="container py-4">
    <h2 class="fw-bold mb-4"><i class="fas fa-credit-card me-2 text-primary"></i>Checkout</h2>

    <!-- PROGRESS STEPS -->
    <div class="d-flex justify-content-center mb-4">
        <div class="checkout-steps">
            <span class="step active"><i class="fas fa-shopping-cart"></i> Cart</span>
            <span class="step-arrow">→</span>
            <span class="step active"><i class="fas fa-map-marker-alt"></i> Details</span>
            <span class="step-arrow">→</span>
            <span class="step"><i class="fas fa-check"></i> Confirm</span>
        </div>
    </div>

    <form th:action="@{/orders/place}" method="post">
        <div class="row">
            <!-- SHIPPING ADDRESS -->
            <div class="col-md-7">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-map-marker-alt me-2"></i>Shipping Address</h5>
                    </div>
                    <div class="card-body">
                        <!-- Pre-fill from user profile -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Shipping Address *</label>
                            <textarea name="shippingAddress" class="form-control" rows="3"
                                      required placeholder="Enter full shipping address..."
                                      th:text="${user.address != null ? user.address + ', ' + (user.city != null ? user.city : '') + ', ' + (user.state != null ? user.state : '') + ' - ' + (user.pinCode != null ? user.pinCode : '') : ''}"></textarea>
                        </div>
                    </div>
                </div>

                <!-- PAYMENT METHOD -->
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-wallet me-2"></i>Payment Method</h5>
                    </div>
                    <div class="card-body">
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="paymentMethod"
                                   id="cod" value="Cash on Delivery" checked>
                            <label class="form-check-label" for="cod">
                                <i class="fas fa-money-bill-wave me-2 text-success"></i>Cash on Delivery
                            </label>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="paymentMethod"
                                   id="upi" value="UPI">
                            <label class="form-check-label" for="upi">
                                <i class="fas fa-mobile-alt me-2 text-primary"></i>UPI Payment
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="paymentMethod"
                                   id="card" value="Credit/Debit Card">
                            <label class="form-check-label" for="card">
                                <i class="fas fa-credit-card me-2 text-info"></i>Credit / Debit Card
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ORDER SUMMARY -->
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0"><i class="fas fa-receipt me-2"></i>Order Summary</h5>
                    </div>
                    <div class="card-body">
                        <div th:each="item : ${cart.cartItems}" class="d-flex justify-content-between mb-2">
                            <div class="d-flex align-items-center gap-2">
                                <img th:src="${item.product.imageUrl}" style="width:40px;height:40px;object-fit:cover;border-radius:5px;"
                                     onerror="this.src='https://via.placeholder.com/40'">
                                <div>
                                    <small class="fw-bold" th:text="${item.product.name}"></small><br>
                                    <small class="text-muted">Qty: <span th:text="${item.quantity}"></span></small>
                                </div>
                            </div>
                            <span class="fw-bold text-end"
                                  th:text="'₹' + ${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')}"></span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between text-success mb-2">
                            <span>Delivery Charges</span><span>FREE</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between fw-bold fs-5">
                            <span>Total Amount</span>
                            <span class="text-primary"
                                  th:text="'₹' + ${#numbers.formatDecimal(cart.totalPrice, 0, 'COMMA', 0, 'POINT')}"></span>
                        </div>

                        <button type="submit" class="btn btn-success w-100 btn-lg mt-4">
                            <i class="fas fa-check-circle me-2"></i>Place Order
                        </button>
                        <a th:href="@{/cart}" class="btn btn-outline-secondary w-100 mt-2">
                            <i class="fas fa-arrow-left me-2"></i>Back to Cart
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
