<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Cart - ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background: #1a1a2e;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/products"><i class="fas fa-shopping-bag me-2"></i>ShopEasy</a>
        <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
                <a class="nav-link position-relative" th:href="@{/cart}">
                    <i class="fas fa-shopping-cart fa-lg"></i>
                    <span class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle"
                          th:text="${cartCount}" th:if="${cartCount > 0}"></span>
                </a>
            </li>
            <li class="nav-item"><a class="nav-link" th:href="@{/profile}"><i class="fas fa-user-circle fa-lg"></i></a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="container py-4">
    <h2 class="fw-bold mb-4"><i class="fas fa-shopping-cart me-2 text-primary"></i>My Cart</h2>

    <!-- FLASH MESSAGES -->
    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

    <!-- EMPTY CART -->
    <div th:if="${cart.cartItems.isEmpty()}" class="text-center py-5">
        <i class="fas fa-shopping-cart fa-4x text-muted mb-3"></i>
        <h4 class="text-muted">Your cart is empty!</h4>
        <p class="text-muted">Add some products to get started.</p>
        <a th:href="@{/products}" class="btn btn-primary btn-lg mt-2">
            <i class="fas fa-shopping-bag me-2"></i>Start Shopping
        </a>
    </div>

    <!-- CART WITH ITEMS -->
    <div th:if="${!cart.cartItems.isEmpty()}">
        <div class="row">
            <!-- CART ITEMS -->
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body p-0">
                        <div th:each="item : ${cart.cartItems}" class="cart-item p-3 border-bottom">
                            <div class="row align-items-center">
                                <!-- Product Image -->
                                <div class="col-3 col-md-2">
                                    <img th:src="${item.product.imageUrl}" class="img-fluid rounded"
                                         th:alt="${item.product.name}"
                                         onerror="this.src='https://via.placeholder.com/80x80?text=Product'">
                                </div>

                                <!-- Product Info -->
                                <div class="col-5 col-md-4">
                                    <h6 class="fw-bold mb-1">
                                        <a th:href="@{/products/{id}(id=${item.product.id})}"
                                           class="text-dark text-decoration-none" th:text="${item.product.name}"></a>
                                    </h6>
                                    <small class="text-muted" th:text="${item.product.brand}"></small><br>
                                    <span class="text-primary fw-bold"
                                          th:text="'₹' + ${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 0, 'POINT')}"></span>
                                </div>

                                <!-- Quantity Controls -->
                                <div class="col-4 col-md-3">
                                    <form th:action="@{/cart/update/{id}(id=${item.id})}" method="post" class="d-flex align-items-center border rounded" style="width: fit-content;">
                                        <button type="button" class="btn btn-sm px-2"
                                                th:onclick="'updateQty(' + ${item.id} + ', ' + (${item.quantity} - 1) + ')'">−</button>
                                        <input type="number" name="quantity" th:value="${item.quantity}"
                                               min="1" max="99" class="form-control border-0 text-center p-1"
                                               style="width:50px;"
                                               th:id="'qty_' + ${item.id}"
                                               onchange="this.form.submit()">
                                        <button type="button" class="btn btn-sm px-2"
                                                th:onclick="'updateQty(' + ${item.id} + ', ' + (${item.quantity} + 1) + ')'">+</button>
                                    </form>
                                </div>

                                <!-- Subtotal + Remove -->
                                <div class="col-12 col-md-3 mt-2 mt-md-0 d-flex align-items-center justify-content-between justify-content-md-end gap-3">
                                    <span class="fw-bold text-success"
                                          th:text="'₹' + ${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')}"></span>
                                    <form th:action="@{/cart/remove/{id}(id=${item.id})}" method="post">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                                onclick="return confirm('Remove this item?')">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-3">
                    <a th:href="@{/products}" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Continue Shopping
                    </a>
                </div>
            </div>

            <!-- ORDER SUMMARY -->
            <div class="col-lg-4 mt-4 mt-lg-0">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0"><i class="fas fa-receipt me-2"></i>Order Summary</h5>
                    </div>
                    <div class="card-body">
                        <div th:each="item : ${cart.cartItems}" class="d-flex justify-content-between mb-2 small">
                            <span th:text="${item.product.name} + ' x' + ${item.quantity}"></span>
                            <span th:text="'₹' + ${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')}"></span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Subtotal (<span th:text="${cart.totalItems}"></span> items)</span>
                            <span th:text="'₹' + ${#numbers.formatDecimal(cart.totalPrice, 0, 'COMMA', 0, 'POINT')}"></span>
                        </div>
                        <div class="d-flex justify-content-between mb-2 text-success">
                            <span>Delivery</span>
                            <span>FREE</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between fw-bold fs-5">
                            <span>Total</span>
                            <span class="text-primary"
                                  th:text="'₹' + ${#numbers.formatDecimal(cart.totalPrice, 0, 'COMMA', 0, 'POINT')}"></span>
                        </div>

                        <a th:href="@{/orders/checkout}" class="btn btn-success w-100 btn-lg mt-4">
                            <i class="fas fa-lock me-2"></i>Proceed to Checkout
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="footer mt-5">
    <div class="container text-center py-4">
        <p class="mb-0">&copy; 2024 ShopEasy. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function updateQty(itemId, newQty) {
    if (newQty < 1) {
        if (!confirm('Remove this item from cart?')) return;
        newQty = 0;
    }
    let form = document.createElement('form');
    form.method = 'POST';
    form.action = '/cart/update/' + itemId;
    let input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'quantity';
    input.value = newQty;
    form.appendChild(input);
    document.body.appendChild(form);
    form.submit();
}
</script>
</body>
</html>
